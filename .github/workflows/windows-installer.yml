name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'v4.8.*'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install application and build deps
        run: |
          python -m pip install -r requirements.txt -r requirements-desktop-build.txt
      - name: Compile and pure Python unit tests
        run: |
          python -m compileall -q primate_ai
          python -m unittest discover -s tests -v
      - name: Build the frozen desktop application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name PrimateBehaviorAI --icon assets/app_icon.ico --add-data "assets;assets" --add-data "models;models" --collect-all PySide6 --collect-all cv2 --collect-submodules sklearn --hidden-import pandas --hidden-import matplotlib --hidden-import openpyxl main.py
          if (!(Test-Path "dist/PrimateBehaviorAI/PrimateBehaviorAI.exe")) { throw "missing exe" }
      - name: Verify frozen runtime starts without Python
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/PrimateBehaviorAI/PrimateBehaviorAI.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "frozen self-test failed: $($p.ExitCode)" }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Create offline installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\PrimateBehaviorAI.iss"
          if (!(Test-Path "installer_output/PrimateBehaviorAI_Setup_4.8.0_x64.exe")) { throw "missing installer" }
      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: PrimateBehaviorAI-4.8.0-Windows-Installer
          path: installer_output/*.exe
          if-no-files-found: error
      - name: Upload portable desktop directory
        uses: actions/upload-artifact@v4
        with:
          name: PrimateBehaviorAI-4.8.0-Portable-Windows
          path: dist/PrimateBehaviorAI/**
          if-no-files-found: error
